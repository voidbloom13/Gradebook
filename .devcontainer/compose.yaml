services:
    workspace:
        container_name: workspace
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        environment:
            ConnectionStrings__DefaultConnection: >-
                Host=db;
                Port=5432;
                Database=${PG_DATABASE:-GradebookDb};
                Username=${PG_USER:-user};
                Password=${PG_PASSWORD:?PG_PASSWORD must be set in .env};
        volumes:
            - ..:/workspace/gradebook
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:17-alpine
        container_name: db
        environment:
            POSTGRES_USER: ${PG_USER:-user}
            POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
            POSTGRES_DB: ${PG_DATABASE:-GradebookDb}
        ports:
            - "5432:5432"
        volumes:
            - gradebook-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-user} -d ${PG_DATABASE:-GradebookDb}"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    gradebook-db-data:
