services:
    workspace:
        container_name: workspace
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        environment:
            ConnectionStrings__DefaultConnection: >-
                Server=db;
                Database=Gradebook;
                User Id=sa;
                Password=${MS_SQL_SERVER_PASSWORD:?MS_SQL_SERVER_PASSWORD is not set in .env file};
                TrustServerCertificate=True;
        volumes:
            - ..:/workspace/gradebook
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: db
        environment:
            SA_PASSWORD: "${MS_SQL_SERVER_PASSWORD:?MS_SQL_SERVER_PASSWORD is not set in .env file}" 
            ACCEPT_EULA: "Y"
        volumes:
            - gradebook-db-data:/var/opt/mssql
        ports:
            - "1433:1433"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
                ] 
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 20s

volumes:
    gradebook-db-data: