<form class="w-1/2 flex flex-col items-center justify-center" [formGroup]="loginRequestForm" (ngSubmit)="onSubmit()">
  <label class="w-full mb-1 font-bold text-lg text-left text-cyan-50" for="email">Email</label>
  <input class="w-full mb-2 px-2 py-1 bg-cyan-100 focus:bg-cyan-50 border border-cyan-950 rounded-sm outline-none active:outline-none" id="email" type="email" formControlName="email" />
  <label class="w-full mb-1 font-bold text-lg text-left text-cyan-50" for="password">Password</label>
  <input class="w-full mb-2 px-2 py-1 bg-cyan-100 focus:bg-cyan-50 border border-cyan-950 rounded-sm outline-none active:outline-none" id="password" type="password" formControlName="password" />
  <button class="w-28 px-2 py-1 bg-cyan-200 hover:bg-cyan-50 active:bg-cyan-50 border border-cyan-950 rounded-sm transition-all duration-150" id="login-submit" type="submit">Login</button>
</form>
