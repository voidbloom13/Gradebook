<div class="w-2xl max-w-[90vw] h-90vh p-5 bg-black/30 border-cyan-600 rounded-lg">
  <app-login-form />
  <div class="w-full flex gap-0">
    <button class="text-cyan-50 text-xl font-bold" [class.bg-cyan-400]="displayForm" [class.bg-mist-300]="!displayForm" (click)="showLogin()">Login</button>
    <button class="text-cyan-50 text-xl font-bold" [class.bg-cyan-400]="!displayForm" [class.bg-mist-300]="displayForm" (click)="showSignup()">Sign Up</button>
  </div>
</div>
