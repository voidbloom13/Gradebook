<div class="w-xl max-w-[90vw] max-h-[90vh] min-h-[60vh] flex flex-col justify-evenly items-center bg-black/60 backdrop-blur-xs border border-mist-400/40 rounded-lg shadow-black/50 shadow-md">
    <h1 class="text-center text-3xl text-cyan-50 font-bold">Verify Your Email</h1>
    <div class="w-full flex flex-col justify-center items-center gap-2">
        <p class="text-cyan-50">
            We've sent a 6-digit code to 
            <strong class="font-bold text-cyan-300/75">
                {{ emailAddress() }}
            </strong>
        </p>
        <p class="text-cyan-50">
            Please enter the code below to verify your email.
        </p>
    </div>
    <form class="w-full" [formGroup]="emailVerificationCodeForm" ngSubmit="onSubmit()">
        <div class="w-full flex flex-row justify-evenly items-center" formArrayName="code">
            @for (control of code.controls; track $index) {
                <input class="w-14 h-14 bg-linear-to-br from-mist-700/60 via-mist-800/60 to-mist-700/60 border border-mist-400/60 focus:outline focus:outline-2 focus:outline-violet-300 rounded-lg text-mist-300 text-3xl" [ngClass]="{'border-red-500 focus:border-violet-300': control.touched && control.invalid}" type="text" [formControlName]="$index"/>
            }
        </div>
    </form>
    <div class="w-full flex flex-col justify-center items-center gap-4">
        <p class="text-cyan-50">Didn't get the code? 
            <a class="text-cyan-200/70 hover:text-cyan-200 font-bold cursor-pointer" (click)="generateCode()">Resend Code</a>
        </p>
        <p class="text-cyan-50">
            Click 
            <a class="text-cyan-200/70 hover:text-cyan-200 font-bold cursor-pointer" (click)="changeEmail()">here</a> 
            to update your email address
        </p>
        <hr class="w-9/10 text-mist-300/30" />
        <a class="text-cyan-100/40 hover:text-cyan-100/75 cursor-pointer" (click)="logout()">
            <fa-icon [icon]="faArrowLeft"></fa-icon>
            Back to login
        </a>
    </div>
</div>
