<div class="w-lg max-w-[90vw] max-h-[90vh] min-h-[60vh] flex flex-col justify-evenly items-center bg-black/60 backdrop-blur-xs border border-mist-400/40 rounded-lg shadow-black/50 shadow-md">
    <h1 class="text-center text-3xl text-cyan-50 font-bold">Reset Your Password</h1>
    <p class="text-cyan-50">Update your password to maintain access to your account.</p>
    <form class="w-full p-4 flex flex-col gap-2 items-center justify-center">
        <label for="current-password">Current Password</label>
        <input type="password" id="current-password" />

        <label for="new-password">New Password</label>
        <input type="password" id="new-password" />

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" />

        <button type="submit">Update Password</button>
    </form>
    <a class="text-cyan-200/70 hover:text-cyan-200 font-bold cursor-pointer" (click)="forgotPassword()">Forgot Password?</a>
    <hr class="w-9/10 text-mist-300/30" />
    <a class="text-cyan-100/40 hover:text-cyan-100/75 cursor-pointer" (click)="backToDashboard()">
        <fa-icon [icon]="faArrowLeft"></fa-icon>
        Dashboard
    </a>
</div>
